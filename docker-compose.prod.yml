name: queuemate-production

services:
  minio:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    restart: unless-stopped
    command: server /data
    env_file: [.env]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    restart: unless-stopped
    env_file: [.env]
    command: sh -c "npx prisma db push && node apps/api/dist/server.js"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: production
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  minio_data:

networks:
  internal:
    driver: bridge
