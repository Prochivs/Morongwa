name: queuemate

services:
  minio:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-queuemate}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-queuemate_minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "silo", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [queuemate]

  minio-init:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mcli alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mcli mb --ignore-existing local/$${MINIO_BUCKET} &&
        mcli anonymous set none local/$${MINIO_BUCKET}
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-queuemate}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-queuemate_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-queuemate-private}
    networks: [queuemate]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: development
    env_file: [.env]
    environment:
      MINIO_ENDPOINT: http://minio:9000
    command: sh -c "npx prisma db push && npm run dev -w @queuemate/api"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - ./prisma:/app/prisma
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [queuemate]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: development
    env_file: [.env]
    environment:
      API_URL: http://api:4000
    command: npm run dev -w @queuemate/web
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [queuemate]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [queuemate]

volumes:
  minio_data:

networks:
  queuemate:
    driver: bridge
